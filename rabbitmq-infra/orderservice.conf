; /etc/supervisor/conf.d/orderservice.conf   (production; in development use separate terminals)
[program:order-consumer]
command=php /var/www/OrderService/artisan rabbitmq:consume order.inventory --max-runtime=3600
directory=/var/www/OrderService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/order-consumer.log
redirect_stderr=true

[program:order-outbox]
command=php /var/www/OrderService/artisan outbox:publish --max-runtime=3600
directory=/var/www/OrderService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/order-outbox.log
redirect_stderr=true

; cancels expired unpaid orders, syncs pre-orders, completes delivered orders, prunes the outbox
[program:order-scheduler]
command=php /var/www/OrderService/artisan schedule:work
directory=/var/www/OrderService
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/order-scheduler.log
redirect_stderr=true
