; /etc/supervisor/conf.d/notificationservice.conf   (production; in development use separate terminals)
; NotificationService only consumes: there is no outbox publisher.
[program:notification-order-consumer]
command=php /var/www/NotificationService/artisan rabbitmq:consume notification.order --max-runtime=3600
directory=/var/www/NotificationService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/notification-order-consumer.log
redirect_stderr=true

[program:notification-inventory-consumer]
command=php /var/www/NotificationService/artisan rabbitmq:consume notification.inventory --max-runtime=3600
directory=/var/www/NotificationService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/notification-inventory-consumer.log
redirect_stderr=true

; sends the e-mails (Laravel job queue on Redis)
[program:notification-email-worker]
command=php /var/www/NotificationService/artisan queue:work redis --queue=notifications --sleep=3 --tries=4 --max-time=3600
directory=/var/www/NotificationService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/notification-email-worker.log
redirect_stderr=true

; prunes old notifications daily
[program:notification-scheduler]
command=php /var/www/NotificationService/artisan schedule:work
directory=/var/www/NotificationService
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/notification-scheduler.log
redirect_stderr=true
