; /etc/supervisor/conf.d/inventoryservice.conf   (production; in development use separate terminals)
[program:inventory-consumer]
command=php /var/www/InventoryService/artisan rabbitmq:consume inventory.catalog --max-runtime=3600
directory=/var/www/InventoryService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/inventory-consumer.log
redirect_stderr=true

[program:inventory-outbox]
command=php /var/www/InventoryService/artisan outbox:publish --max-runtime=3600
directory=/var/www/InventoryService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/inventory-outbox.log
redirect_stderr=true

; expires unpaid reservations every minute and prunes old outbox rows
[program:inventory-scheduler]
command=php /var/www/InventoryService/artisan schedule:work
directory=/var/www/InventoryService
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/inventory-scheduler.log
redirect_stderr=true
