; /etc/supervisor/conf.d/productservice.conf   (production; in development use separate terminals)
[program:product-outbox]
command=php /var/www/ProductService/artisan outbox:publish --max-runtime=3600
directory=/var/www/ProductService
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/product-outbox.log
redirect_stderr=true

; only if you keep other queued jobs in this service (the old HTTP sync job no longer exists)
; [program:product-queue]
; command=php /var/www/ProductService/artisan queue:work --sleep=3 --tries=3 --max-time=3600
